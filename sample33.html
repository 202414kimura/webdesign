<!DOCTYPE html>
<html lang="ja">
  <head>

        body{

        /* ヘッター CSS */

        /* メインコンテンツ CSS */

        h2{
          font-size:24px;
          color:darkred;
        }

          font-size:20px;

      <img src="Images/header.jpg" alt="金のモンブランヘッダー画像">
      <nav>
        <ul>
          <li><a href="#blanc">モンブラン</a></li>
          <li><a href="#macron">マカロン</a></li>

    <main>
      <article>

      </section>
      <section>
  <h3 id="macron">マカロン</h3>
  <p>沖縄産の砂糖を使用したマカロンです。</p>
  <img src="Images/macron1.jpg" alt="マカロンの写真">

      </article>
    </main>
    <footer>
